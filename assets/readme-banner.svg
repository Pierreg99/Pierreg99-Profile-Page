<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">CRYO / Pierreg99 — Ideas into code. Code into experiences.</title>
  <desc id="banner-desc">A dark technical portfolio banner with a glowing cyan core and orbit rings beside the CRYO / Pierreg99 title and the disciplines AI, software, games, and 3D.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050b12"/>
      <stop offset="0.58" stop-color="#0a1721"/>
      <stop offset="1" stop-color="#0b202b"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7be8fa"/>
      <stop offset="0.48" stop-color="#3aa7c7"/>
      <stop offset="1" stop-color="#987de5"/>
    </linearGradient>
    <radialGradient id="core" cx="42%" cy="32%" r="72%">
      <stop offset="0" stop-color="#e5fcff"/>
      <stop offset="0.22" stop-color="#8df0ff"/>
      <stop offset="0.55" stop-color="#2ab4d3"/>
      <stop offset="1" stop-color="#14506a"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#73cfe6" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="panel">
      <rect x="14" y="14" width="1172" height="292" rx="18"/>
    </clipPath>
  </defs>
  <rect width="1200" height="320" rx="22" fill="#03070c"/>
  <rect x="14" y="14" width="1172" height="292" rx="18" fill="url(#background)" stroke="#234454" stroke-width="1.4"/>
  <g clip-path="url(#panel)">
    <rect x="14" y="14" width="1172" height="292" fill="url(#grid)"/>
    <path d="M14 258H1186" stroke="#3d7184" stroke-opacity=".28"/>
    <path d="M14 34H300" stroke="url(#edge)" stroke-width="3"/>
    <path d="M800 14L1186 256" stroke="#70dcf2" stroke-opacity=".07" stroke-width="52"/>
    <path d="M870 14L1186 212" stroke="#b2a0f4" stroke-opacity=".06" stroke-width="20"/>
    <g transform="translate(964 142)">
