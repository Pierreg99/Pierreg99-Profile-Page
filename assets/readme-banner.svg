    <text x="60" y="281" fill="#587787" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9" letter-spacing="2.3">PUBLIC PROJECT PORTFOLIO · BUILT TO BE EXPLORED</text>
    <text x="1128" y="282" text-anchor="end" fill="#8cb5c5" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9" letter-spacing="1.7">01 — ∞</text>
