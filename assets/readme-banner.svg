      <circle r="77" fill="none" stroke="#6adff7" stroke-opacity=".35" stroke-width="1.4"/>
      <circle r="58" fill="none" stroke="#6adff7" stroke-opacity=".26" stroke-dasharray="3 8" stroke-width="2"/>
      <ellipse rx="105" ry="36" transform="rotate(-31)" fill="none" stroke="#83e8fb" stroke-opacity=".66" stroke-width="1.5"/>
      <ellipse rx="106" ry="37" transform="rotate(42)" fill="none" stroke="#9b91eb" stroke-opacity=".75" stroke-width="1.5"/>
      <ellipse rx="79" ry="27" transform="rotate(88)" fill="none" stroke="#4a9dbb" stroke-opacity=".8" stroke-width="1.2"/>
      <circle r="32" fill="#38c9e8" fill-opacity=".23" filter="url(#glow)"/>
      <circle r="23" fill="url(#core)" stroke="#d8fbff" stroke-opacity=".85" stroke-width="1.2"/>
      <circle r="8" cx="-7" cy="-7" fill="#f0fdff" fill-opacity=".82"/>
      <circle cx="70" cy="-50" r="4" fill="#9af1ff"/>
      <circle cx="-84" cy="17" r="3" fill="#c2b5ff"/>
      <path d="M-125 0H-111M111 0H125M0-125V-111M0 111V125" stroke="#8deafb" stroke-opacity=".55" stroke-width="1.5"/>
    </g>
    <g fill="#90ddeb" fill-opacity=".72">
      <circle cx="820" cy="66" r="2"/>
      <circle cx="1094" cy="244" r="2"/>
      <circle cx="1121" cy="55" r="1.5"/>
      <circle cx="856" cy="227" r="1.5"/>
      <circle cx="1068" cy="85" r="1.5"/>
    </g>
  </g>
  <g font-family="Segoe UI, Inter, system-ui, sans-serif">
    <text x="60" y="77" fill="#8fe9fa" font-size="13" font-weight="650" letter-spacing="5">CRYO / PIERREG99</text>
    <text x="58" y="145" fill="#f0f5f7" font-size="47" font-weight="650" letter-spacing="-1.4">Ideas into code.</text>
    <text x="60" y="192" fill="#c9d9e0" font-size="29" font-weight="450" letter-spacing="-.35">Code into experiences.</text>
