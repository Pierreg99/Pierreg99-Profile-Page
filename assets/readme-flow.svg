<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="title desc">
  <title id="title">CRYO delivery flow: Discover, Design and Build, Verify, Share</title>
  <desc id="desc">Four horizontal stages connected by a cyan-to-rose route. The release stage follows test and accessibility verification.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#08121f"/><stop offset="1" stop-color="#101d30"/></linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8ce5f2"/><stop offset=".7" stop-color="#a7a9ff"/><stop offset="1" stop-color="#f2a7d9"/></linearGradient>
  </defs>
  <rect width="1200" height="240" rx="22" fill="url(#bg)"/>
  <rect x="12" y="12" width="1176" height="216" rx="15" fill="none" stroke="#3d6071"/>
  <text x="42" y="42" font-family="Arial,sans-serif" font-size="12" letter-spacing="3" fill="#8de6f5">CRYO / VERIFIED DELIVERY PATH</text>
  <path d="M112 113H1088" stroke="#253d50" stroke-width="6" stroke-linecap="round"/>
  <path d="M112 113H1088" stroke="url(#route)" stroke-width="2.5" stroke-linecap="round"/>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <circle cx="128" cy="113" r="27" fill="#0d2230" stroke="#8ce5f2" stroke-width="2"/><text x="128" y="120" font-size="21" fill="#b9f5ff">01</text>
    <circle cx="440" cy="113" r="27" fill="#10213b" stroke="#a5bbfc" stroke-width="2"/><text x="440" y="120" font-size="21" fill="#d4dbff">02</text>
    <circle cx="752" cy="113" r="27" fill="#1c1a38" stroke="#aca9ff" stroke-width="2"/><text x="752" y="120" font-size="21" fill="#e1dcff">03</text>
    <circle cx="1064" cy="113" r="27" fill="#281b31" stroke="#e4a2db" stroke-width="2"/><text x="1064" y="120" font-size="21" fill="#ffe2f6">04</text>
    <text x="128" y="164" font-size="19" fill="#f1f7ff" font-weight="bold">DISCOVER</text>
    <text x="440" y="164" font-size="19" fill="#f1f7ff" font-weight="bold">DESIGN &amp; BUILD</text>
    <text x="752" y="164" font-size="19" fill="#f1f7ff" font-weight="bold">VERIFY</text>
    <text x="1064" y="164" font-size="19" fill="#f1f7ff" font-weight="bold">SHARE</text>
    <text x="128" y="189" font-size="13" fill="#adc0d2">Public evidence</text>
    <text x="440" y="189" font-size="13" fill="#adc0d2">Source &amp; design</text>
    <text x="752" y="189" font-size="13" fill="#adc0d2">CI / accessibility</text>
    <text x="1064" y="189" font-size="13" fill="#adc0d2">Validated artifact</text>
  </g>
</svg>
